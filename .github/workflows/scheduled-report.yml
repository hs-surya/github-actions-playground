name: Scheduled Repository Report

on:
  schedule:
    - cron: "30 2 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate repository report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python github_api_report.py

      - name: Upload repository report
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-github-report
          path: github-api-report.txt
